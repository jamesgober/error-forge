[package]
name = "error-forge"
# 1.0.0 (2026-05-18) — stable API. Public surface frozen under
# SemVer for the entire 1.x line. See docs/STABILITY.md for the
# binding contract and docs/API-FREEZE-AUDIT.md for the surface
# manifest. Major changes vs 0.9.x: `group!` macro rewritten
# (requires `: ForgeError` on wrapped types), `CircuitBreaker`
# switched to `parking_lot::Mutex` (no poisoning), hook callback
# widened to `Box<dyn Fn>`, `#[non_exhaustive]` on several
# public types, `Result<T>` deprecated in favour of `AppResult<T>`,
# `register_error_hook` (non-try) deprecated, `rand` gated behind
# new `jitter` feature.
version = "1.1.0"
edition = "2021"
# MSRV. The crate uses `io::Error::other` (stabilised 1.74),
# `Mutex::new()` in const context (1.63 — fine), and Cargo lockfile
# format v4 (default since 1.78, can't be parsed by older
# toolchains). `1.81` is also the floor required by clippy's
# `incompatible_msrv` lint on the current source, and matches
# `mod-events` in this workspace for consistency. CI verifies on
# 1.81.0 in a dedicated MSRV job.
rust-version = "1.81"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Pragmatic Rust error-handling framework with stable error metadata, contextual diagnostics, optional async support, and synchronous recovery primitives (retry, circuit-breaker, backoff). Optional #[derive(ModError)], declarative define_errors!, and feature-gated logging / tracing / serde adapters."

keywords = [
    "error",
    "error-handling",
    "async",
    "resilience",
    "circuit-breaker"
]

categories = [
    "rust-patterns",
    "development-tools::debugging",
    "asynchronous",
    "development-tools"
]

documentation = "https://docs.rs/error-forge"
repository = "https://github.com/jamesgober/error-forge"
homepage = "https://github.com/jamesgober/error-forge"

# Configuration for docs.rs
[package.metadata.docs.rs]
# Enable all features when building docs
all-features = true
# Enable specific features for documentation
features = ["derive", "serde", "console", "backtrace"]
# Set specific rustdoc flags
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# The only always-on dependency, and an in-house one. With default
# features off it is a dependency-free proc-macro crate that supplies
# the identifier pasting `define_errors!` needs (it replaced the
# third-party `pastey`, and before that `paste`). The `derive` feature
# below turns on its `#[derive(ModError)]`, which brings in `syn`,
# `quote` and `proc-macro2`.
error-forge-derive = { version = "1.1.0", path = "./error-forge-derive", default-features = false }
# Floors below are checked by the `minimal-versions` CI job: `serde`
# 1.0.157 is the first release whose derive builds alongside the
# `syn` 1 floor of `error-forge-derive`, `log` 0.4.4 the first whose
# macros resolve `log!` through `$crate`, and `tracing` 0.1.6 the first
# that accepts the `target:` plus field syntax used by the adapter.
serde = { version = "1.0.157", optional = true, features = ["derive"] }
log = { version = "0.4.4", optional = true }
tracing = { version = "0.1.6", optional = true }
async-trait = { version = "0.1.74", optional = true }
# `rand` is only used to add ±20% jitter to `ExponentialBackoff` when
# the caller opts in. Gated behind the `jitter` feature so users who
# never call `ExponentialBackoff::with_jitter(true)` don't pay for
# `rand`'s transitive deps (`getrandom`, `rand_core`, `rand_chacha`,
# `ppv-lite86`).
rand = { version = "0.8.5", optional = true }

[features]
default = []
derive = ["error-forge-derive"]
# Up to 1.0.2 `error-forge-derive` was an optional dependency and this
# was the feature Cargo created for it. It is kept, with the same
# meaning, so manifests that name it keep resolving and `derive` still
# implies it: it compiles the derive macro, and `derive` re-exports it.
error-forge-derive = ["error-forge-derive/derive"]
serde = ["dep:serde"]
# `console`, `backtrace`, `registry`, `collector` and `context` gate
# nothing: the related APIs are always compiled in and no backtrace is
# captured automatically. They stay so existing manifests that enable
# them keep resolving (removing a feature is a breaking change).
console = []
backtrace = []
# Enables ±20% jitter in `recovery::ExponentialBackoff::with_jitter`.
# Pulls in `rand` for non-cryptographic random delays. Off by
# default — backoff still works without it, jitter is a no-op.
jitter = ["dep:rand"]
log = ["dep:log"]
tracing = ["dep:tracing"]
registry = []
collector = []
context = []
async = ["dep:async-trait"]

[workspace]
members = ["error-forge-derive"]

[dev-dependencies]
serde_json = "1.0"
# Compile-pass / compile-fail tests (`tests/ui_test.rs`). Needs a newer
# toolchain than the MSRV; the MSRV CI job resolves an older release
# and skips the UI test.
trybuild = "1.0.100"
tokio = { version = "1.52", features = ["full", "test-util", "macros"] }
