[package]
name = "error-forge-derive"
version = "1.0.2"
edition = "2021"
rust-version = "1.81"
description = "Derive macros for the error-forge crate"
license = "Apache-2.0"
documentation = "https://docs.rs/error-forge"
repository = "https://github.com/jamesgober/error-forge"
homepage = "https://github.com/jamesgober/error-forge"
authors = [
    "James Gober <me@jamesgober.com>"
]

[lib]
proc-macro = true

[dependencies]
# Floors checked with `cargo update -Z direct-minimal-versions` (see the
# `minimal-versions` CI job): `syn` 1.0.3 adds `Path::get_ident`, and
# `quote` / `proc-macro2` match what `async-trait` needs in the same graph.
syn = "1.0.3"
quote = "1.0.29"
proc-macro2 = "1.0.63"
